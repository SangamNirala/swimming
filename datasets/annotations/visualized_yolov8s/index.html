<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv8s Annotation Viewer - Swimming Pool Drowning Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 3px solid #667eea;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-size: 0.9em;
        }

        .filters {
            padding: 30px;
            background: #f8f9fa;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 2px solid #dee2e6;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9em;
        }

        select, input {
            padding: 10px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover, input:hover {
            border-color: #667eea;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .gallery {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .image-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .image-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .image-info {
            padding: 15px;
            background: #f8f9fa;
        }

        .image-name {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
            font-size: 0.9em;
            word-break: break-all;
        }

        .image-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .tag.swimming {
            background: #d4edda;
            color: #155724;
        }

        .tag.drowning {
            background: #f8d7da;
            color: #721c24;
        }

        .tag.train {
            background: #d1ecf1;
            color: #0c5460;
        }

        .tag.val {
            background: #fff3cd;
            color: #856404;
        }

        .tag.test {
            background: #e2e3e5;
            color: #383d41;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: white;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            color: #333;
            border: none;
            padding: 15px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.5em;
            font-weight: bold;
        }

        .modal-nav.prev {
            left: -60px;
        }

        .modal-nav.next {
            right: -60px;
        }

        .no-results {
            padding: 60px;
            text-align: center;
            color: #6c757d;
        }

        .no-results h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .legend {
            padding: 20px 30px;
            background: #fff;
            border-top: 2px solid #dee2e6;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-box {
            width: 30px;
            height: 20px;
            border: 3px solid;
            border-radius: 4px;
        }

        .legend-box.swimming {
            border-color: #00FF00;
            background: rgba(0, 255, 0, 0.1);
        }

        .legend-box.drowning {
            border-color: #FF0000;
            background: rgba(255, 0, 0, 0.1);
        }

        .legend-text {
            font-weight: 600;
            color: #495057;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏊 YOLOv8s Annotation Viewer</h1>
            <p>Swimming Pool Drowning Detection - Manual Validation</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>9,342</h3>
                <p>Total Annotated</p>
            </div>
            <div class="stat-card">
                <h3>602</h3>
                <p>Visualized Samples</p>
            </div>
            <div class="stat-card">
                <h3>70.8%</h3>
                <p>Detection Rate</p>
            </div>
            <div class="stat-card">
                <h3>23,951</h3>
                <p>Bounding Boxes</p>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-box swimming"></div>
                <span class="legend-text">🟢 Green Box = Swimming (Normal Behavior)</span>
            </div>
            <div class="legend-item">
                <div class="legend-box drowning"></div>
                <span class="legend-text">🔴 Red Box = Drowning (Distress)</span>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="splitFilter">Split:</label>
                <select id="splitFilter">
                    <option value="all">All Splits</option>
                    <option value="train">Train</option>
                    <option value="val">Validation</option>
                    <option value="test">Test</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="classFilter">Class:</label>
                <select id="classFilter">
                    <option value="all">All Classes</option>
                    <option value="swimming">Swimming</option>
                    <option value="drowning">Drowning</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="searchInput">Search:</label>
                <input type="text" id="searchInput" placeholder="Filter by filename...">
            </div>
        </div>

        <div class="gallery" id="gallery"></div>

        <div class="modal" id="modal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">✕ Close</button>
                <button class="modal-nav prev" onclick="prevImage()">‹</button>
                <img id="modalImage" src="" alt="Full size">
                <button class="modal-nav next" onclick="nextImage()">›</button>
            </div>
        </div>
    </div>

    <script>
        // Image data structure
        const images = [];
        let currentImageIndex = 0;
        let filteredImages = [];

        // Generate image list
        const splits = ['train', 'val', 'test'];
        const classes = ['swimming', 'drowning'];
        
        // You need to populate this with actual image files
        // This is a placeholder - in production, you'd scan the directory
        function loadImages() {
            // This would be populated by scanning the directory
            // For now, we'll create placeholders
            console.log('Loading images from directory...');
            
            // Example structure (replace with actual directory scanning)
            fetch('visualization_stats.json')
                .then(response => response.json())
                .then(data => {
                    console.log('Loaded stats:', data);
                    // Process and display images based on stats
                    displayPlaceholder();
                })
                .catch(err => {
                    console.log('Could not load stats, using placeholder');
                    displayPlaceholder();
                });
        }

        function displayPlaceholder() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = `
                <div class="no-results">
                    <h2>📁 Visualized Images Ready!</h2>
                    <p style="margin: 20px 0; font-size: 1.1em;">
                        <strong>600+ annotated images</strong> are saved in:<br><br>
                        <code style="background: #f8f9fa; padding: 10px 20px; border-radius: 5px; display: inline-block;">
                        /app/datasets/annotations/visualized_yolov8s/
                        </code>
                    </p>
                    <p style="margin: 20px 0;">
                        Browse the images to manually validate the annotations!
                    </p>
                    <h3 style="margin-top: 30px; color: #667eea;">Directory Structure:</h3>
                    <div style="text-align: left; max-width: 400px; margin: 20px auto; background: #f8f9fa; padding: 20px; border-radius: 10px;">
                        <div>📁 train/</div>
                        <div style="margin-left: 20px;">├─ 🟢 swimming/ (102 images)</div>
                        <div style="margin-left: 20px;">└─ 🔴 drowning/ (100 images)</div>
                        <div style="margin-top: 10px;">📁 val/</div>
                        <div style="margin-left: 20px;">├─ 🟢 swimming/ (100 images)</div>
                        <div style="margin-left: 20px;">└─ 🔴 drowning/ (100 images)</div>
                        <div style="margin-top: 10px;">📁 test/</div>
                        <div style="margin-left: 20px;">├─ 🟢 swimming/ (100 images)</div>
                        <div style="margin-left: 20px;">└─ 🔴 drowning/ (100 images)</div>
                    </div>
                    <p style="margin-top: 30px; padding: 15px; background: #d4edda; border-radius: 8px; color: #155724;">
                        <strong>✅ Each image shows:</strong><br>
                        • Green boxes for swimming people<br>
                        • Red boxes for drowning people<br>
                        • Person numbers and labels<br>
                        • Filename and detection count
                    </p>
                </div>
            `;
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', loadImages);

        // Modal functions
        function openModal(index) {
            currentImageIndex = index;
            showModalImage();
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function showModalImage() {
            if (filteredImages[currentImageIndex]) {
                document.getElementById('modalImage').src = filteredImages[currentImageIndex].path;
            }
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % filteredImages.length;
            showModalImage();
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + filteredImages.length) % filteredImages.length;
            showModalImage();
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });
    </script>
</body>
</html>
